# Attendance System Configuration

camera:
  source: 0                    # 0 = default USB webcam, or RTSP URL string
  width: 1280
  height: 720
  fps: 30

detection:
  det_model: "models/det_10g.onnx"      # RetinaFace detection model
  rec_model: "models/iresnet50_adaface_fp32.onnx"    # Trained AdaFace model
  det_size: [640, 640]                   # Detection input size
  det_thresh: 0.20                       # Minimum face detection confidence (lower = detects faces further away)
  max_faces: 60                          # Max faces to detect per frame

recognition:
  similarity_threshold: 0.25   # Cosine similarity threshold (lower = stricter)
  unknown_threshold: 0.15      # Below this, face is marked as unknown

attendance:
  capture_interval_sec: 5      # Seconds between face captures
  session_duration_sec: 120    # How long to scan (seconds) - default 2 minutes
  min_confidence: 0.4          # Minimum recognition confidence to count as present

enrollment:
  photos_per_student: 5        # Number of photos to take per student
  capture_delay_sec: 2         # Delay between enrollment photos

storage:
  embeddings_dir: "data/embeddings"
  unknown_faces_dir: "data/unknown_faces"
  csv_output_dir: "data/attendance_csv"

api:
  base_url: "http://localhost:8000/api"   # Backend REST API base URL
  timeout_sec: 10
  api_key: "attendance-ai-secret-key-2024"
  endpoints:
    students: "/ai/attendance/students"
    attendance: "/ai/attendance"

server:
  port: 5000                   # Port for server mode (backend triggers scans)
